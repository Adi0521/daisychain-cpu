[project]
name = "daisychain"
version = "0.1.0"
description = "Tooling for the distributed CPU inference cluster (CPU daisy chaining) project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17",
]

[project.scripts]
daisychain = "daisychain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daisychain"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "daisychain/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
