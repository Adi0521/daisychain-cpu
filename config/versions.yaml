# Version matrix (PRD §14 decision 2, M0 exit evidence).
#
# Rules:
#   - `pinned` is set only after the exact version has been installed on the reference
#     nodes and confirmed by `daisychain inventory check` (which errors on mismatches).
#   - `candidate` records the current intent; it is NOT verified until `status: pinned`.
#   - Any change after M1 requires a recorded revision in docs/m0-decisions.md, because
#     results are only comparable under identical versions.
#
# status: open | candidate | pinned
components:
  os:
    candidate: Ubuntu LTS (choose release present on all nodes)
    pinned: null
    status: open
    notes: Record kernel from inventory. cgroup v2 expected; affects Slurm limit enforcement.

  slurm:
    candidate: 23.11.4 (Ubuntu 24.04 slurm-wlm package)
    pinned: null
    status: candidate
    notes: >
      Same version on controller and every worker. Decide with the container launch
      approach (decision 4); see https://slurm.schedmd.com/containers.html.
      Emulated cluster (2026-11-19): 23.11.4 passes allocation, cgroup v2 limits,
      exit-code and cancellation checks. Its mpi/pmix plugin failed to load PMIx;
      re-check when choosing the MPI build. Not yet verified on real nodes.

  container_runtime:
    candidate: >
      Build with Docker; run job steps with Apptainer 1.5.5 (ppa:apptainer/ppa, non-setuid)
      via `srun … apptainer exec <staged image>`
    pinned: null
    status: candidate
    notes: >
      PRD §6 gate: no unrestricted Docker daemon access just to launch jobs. The runtime
      must let Slurm track and limit the actual worker processes. Apptainer runs as the
      submitting user with no daemon, so container processes stay in the Slurm step
      cgroup. Emulated cluster (2026-11-19): identity, limits, OOM, exit-code and
      cancellation checks pass on 8 workers. SIF via squashfuse fails inside the Docker
      Desktop VM, so the emulator stages sandbox directories; re-test SIF on hardware.

  mpi:
    candidate: Open MPI (distribution package), TCP BTL for inter-node traffic
    pinned: null
    status: open
    notes: >
      Same build inside the image and on the host. Record the transport MPI actually
      selects (e.g. --mca btl_base_verbose) and confirm the inter-node path is TCP.

  pmix:
    candidate: Version matching the Slurm and Open MPI builds
    pinned: null
    status: open

  nfs:
    candidate: Kernel NFS server + nfs-common (Ubuntu 24.04), NFSv4.2 only
    pinned: null
    status: candidate
    notes: >
      Client options vers=4.2,soft,timeo=50,retrans=2,noatime (bounded errors). Server
      lease/grace set to 15 s in emulation (kernel default 90 s); choose for hardware,
      since it sets the recovery time after a server restart.

  simgrid:
    candidate: Latest stable SimGrid release at M0 (S4U + SMPI)
    pinned: null
    status: open
    notes: Pin the exact release; platform file syntax changes between major versions.

  prometheus:
    candidate: Prometheus + node_exporter
    pinned: null
    status: open

  grafana:
    candidate: Grafana OSS
    pinned: null
    status: open

  python:
    candidate: Distribution python3 on hosts; image Python pinned in Dockerfile
    pinned: null
    status: open

  inference_runtime:
    candidate: null   # chosen in M1 after memory/runtime measurements (PRD §5)
    pinned: null
    status: open
    notes: Must support fixed precision/quantization and expose prefill/decode timing.

  model:
    candidate: null   # small causal LM that fits comfortably on one worker
    pinned: null      # record as <repo>@<commit sha> plus per-file sha256
    status: open
