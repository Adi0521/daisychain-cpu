# Generated by daisychain (monitoring.py). Do not edit.
groups:
- name: daisychain
  rules:
  - alert: TelemetryMissing
    expr: up{job=~"node|switch"} == 0
    labels:
      severity: page
    annotations:
      summary: '{{ $labels.node }} stopped answering scrapes'
  - alert: SlurmNodeNotResponding
    expr: daisychain_slurm_node_state{responding="false"} == 1
    labels:
      severity: page
  - alert: StagingFailed
    expr: daisychain_stage_success == 0
    labels:
      severity: ticket
  - record: daisychain:switch_port_tx_bps
    expr: label_replace(rate(node_qdisc_bytes_total{job="switch",kind="tbf",device=~"p-.*"}[20s])
      * 8, "to", "$1", "device", "p-(.*)")
